name: Bug report
description: The kit, a hook, a check or the agent following the kit did something wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran, or what you asked the agent. Attach clarifications.md or the hook message if relevant.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `node openspec/tooling/bin/doctor.mjs`
      render: text
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 15, Ubuntu 24.04, WSL 2 …
