# CI of the sdd-kit repository itself (not installed into projects).
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the pinned OpenSpec CLI
        run: npm i -g "@fission-ai/openspec@$(node -p "require('./kit/openspec/tooling/kit.json').openspecVersion")"
      - name: Tests
        run: npm test
        env:
          OPENSPEC_TELEMETRY: "0"
