# CI of the sdd-kit repository itself (not installed into projects).
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: node --test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the pinned OpenSpec CLI
        run: npm i -g "@fission-ai/openspec@$(node -p "require('./kit/core/openspec/tooling/kit.json').openspecVersion")"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Python with pytest + xdist for the pytest plugin tests
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python pytest pytest-xdist
      - name: Tests
        run: npm test
        env:
          SDD_KIT_PYTHON: ${{ github.workspace }}/.venv/bin/python
          OPENSPEC_TELEMETRY: "0"

  sample-e2e:
    name: monorepo sample end to end (pytest + Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the pinned OpenSpec CLI
        run: npm i -g "@fission-ai/openspec@$(node -p "require('./kit/core/openspec/tooling/kit.json').openspecVersion")"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Playwright browser for the sample
        run: npm ci && npx playwright install --with-deps chromium
        working-directory: fixtures/projects/monorepo-sample/e2e
      - name: Sample monorepo end to end
        run: node --test --test-name-pattern="end to end" tests/monorepo.test.mjs
        env:
          SDD_KIT_E2E: "1"
          OPENSPEC_TELEMETRY: "0"
