# sdd-kit: managed file, generated by the installer (presets: django, playwright; adapter: monorepo).
# You may edit it: the kit then keeps your version on update and reports it (re-run with --force to regenerate).
# Hooks stop most problems while you work; this workflow is the backstop on every pull request.
name: sdd-kit

on:
  pull_request:

concurrency:
  group: sdd-kit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit-checks:
    name: sdd-kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changes archived in this PR are found by diffing against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the pinned OpenSpec CLI
        run: npm i -g "@fission-ai/openspec@$(node -p "require('./openspec/tooling/kit.json').openspecVersion")"
      - name: Kit checks (specs, answers, grounding, plans, handoff, archived changes)
        run: node openspec/tooling/bin/ci.mjs checks
        env:
          OPENSPEC_TELEMETRY: "0"

  kit-verify:
    name: sdd-kit verification
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # unit tests use the compose database; E2E runs against the compose stack (see e2e/playwright.config.*)
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      E2E_BASE_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # monorepo adapter: backend/ (uv), e2e/ (Playwright), the stack from docker-compose.yml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend dependencies
        run: uv sync --frozen
        working-directory: backend
      - name: Install E2E dependencies
        run: npm ci
        working-directory: e2e
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Start the stack (docker compose)
        run: docker compose up -d --build --wait
      - name: Verify changes (tests carrying scenario markers, quality gate, E2E, API baseline)
        run: node openspec/tooling/bin/ci.mjs verify
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
