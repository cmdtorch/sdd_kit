# sdd-kit: managed file, generated by the installer (presets: {{PRESETS}}).
# You may edit it: the kit then keeps your version on update and reports it (re-run with --force to regenerate).
# Hooks stop most problems while you work; this workflow is the backstop on every pull request.
name: sdd-kit

on:
  pull_request:

concurrency:
  group: sdd-kit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  kit-checks:
    name: sdd-kit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # changes archived in this PR are found by diffing against the base branch
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install the pinned OpenSpec CLI
        run: npm i -g "@fission-ai/openspec@$(node -p "require('./openspec/tooling/kit.json').openspecVersion")"
      - name: Kit checks (specs, answers, grounding, plans, handoff, archived changes)
        run: node openspec/tooling/bin/ci.mjs checks
        env:
          OPENSPEC_TELEMETRY: "0"
