schema: clarify

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  # >>> sdd-kit >>>
  sdd-kit is installed. For changes on the `clarify`, `clarify-ai-qa`, `clarify-qa` or `lean` schema:
  - Artifacts are written in English, except the questions in clarifications.md.
  - Questions language: Russian
  - Clarifying questions: openspec/protocols/questions.md (default depth: Comprehensive).
  - Source tags and assumptions: openspec/protocols/grounding.md
  - Tests and verification: openspec/protocols/testing.md (use the project's own test commands)
  - Test cases (`clarify-ai-qa`, `clarify-qa`): openspec/protocols/test-cases.md
  - Requirement sources go to openspec/changes/<change>/sources/ as .md, .pdf or .txt.
  - UI screenshots (PNG, JPG, WebP) go to openspec/changes/<change>/sources/ui/ and switch on UI mode:
    openspec/protocols/ui-inventory.md
  New features use `clarify`, or `clarify-ai-qa` / `clarify-qa` for Gherkin test cases reviewed by the
  AI QA reviewer / by it and a human QA; small, clear changes use `lean`. Always name the schema.
  Changes on other schemas (e.g. spec-driven) keep their own workflow.
  # <<< sdd-kit <<<
